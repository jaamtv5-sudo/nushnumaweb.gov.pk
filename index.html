<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<title>نشوونما پروگرام | رزلٹ چیک</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Jameel Noori Nastaleeq -->
<link href="https://fonts.googleapis.com/earlyaccess/jameelnoorinastaleeq.css" rel="stylesheet">

<style>
body{
  margin:0;
  background:#eef3f9;
  font-family:'Jameel Noori Nastaleeq', serif;
  direction:rtl;
}
.banner img{
  width:100%;
  display:block;
}
.header{
  background:#0b6d3a;
  color:#fff;
  text-align:center;
  padding:15px;
}
.header h1{
  margin:0;
  font-size:34px;
}
.header p{
  margin:5px 0 0;
  font-size:22px;
}
.container{
  max-width:600px;
  margin:30px auto;
  background:#ffffff;
  padding:25px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
}
h2{
  text-align:center;
  color:#0b6d3a;
  font-size:30px;
}
label{
  display:block;
  margin-top:18px;
  font-size:24px;
}
input{
  width:100%;
  padding:14px;
  font-size:22px;
  font-family:'Jameel Noori Nastaleeq', serif;
  border-radius:8px;
  border:1px solid #ccc;
}
.captcha-box{
  margin-top:8px;
  padding:12px;
  background:#f1f1f1;
  font-size:30px;
  letter-spacing:6px;
  text-align:center;
  border-radius:8px;
}
button{
  width:100%;
  margin-top:25px;
  padding:16px;
  font-size:26px;
  background:#198754;
  color:white;
  border:none;
  border-radius:10px;
}
.loading{
  display:none;
  text-align:center;
  font-size:22px;
  margin-top:15px;
}
.hidden{display:none;}
.result-box{
  font-size:24px;
  line-height:2;
  padding:15px;
  border-radius:10px;
}
.success{
  background:#e9f7ef;
  border:3px solid #198754;
}
.fail{
  background:#fdecea;
  border:3px solid #b02a37;
  color:#b02a37;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
  <div class="banner">
    <img src="https://i.ibb.co/cSdMRvH4/bisp-full-banner-tracker.png">
  </div>

  <div class="header">
    <h1>نشوونما پروگرام</h1>
    <p>بے نظیر انکم سپورٹ پروگرام</p>
  </div>

  <div class="container">
    <h2>اہلیت / ریکارڈ معلوم کریں</h2>

    <label>شناختی کارڈ نمبر</label>
    <input id="cnic" placeholder="مثال: 1234512345671">

    <label>کیپچا کوڈ</label>
    <div class="captcha-box" id="captcha"></div>
    <input id="captchaInput" placeholder="اوپر دیا گیا کوڈ لکھیں">

    <button onclick="checkResult()">چیک کریں</button>

    <div class="loading" id="loading">براہِ مہربانی انتظار کریں…</div>
  </div>
</div>

<!-- PAGE 2 -->
<div id="page2" class="hidden">
  <div class="container">
    <h2>نتیجہ</h2>
    <div id="resultBox" class="result-box"></div>
    <button onclick="location.reload()">دوبارہ چیک کریں</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDBDDgWlq6-QOsLWPLBlCWQ9S_Xp3z5r9I",
  authDomain: "nunma-8c477.firebaseapp.com",
  databaseURL: "https://nunma-8c477-default-rtdb.firebaseio.com",
  projectId: "nunma-8c477",
  messagingSenderId: "287427812438",
  appId: "1:287427812438:web:5c04823daf58c4d5a92ff7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* CAPTCHA */
let captchaText="";
function makeCaptcha(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  captchaText="";
  for(let i=0;i<4;i++){
    captchaText+=chars[Math.floor(Math.random()*chars.length)];
  }
  captcha.innerText=captchaText;
}
makeCaptcha();

/* RESULT CHECK */
window.checkResult=function(){
  if(captchaInput.value.toUpperCase()!==captchaText){
    alert("کیپچا درست نہیں");
    makeCaptcha();
    return;
  }

  loading.style.display="block";

  get(ref(db,"results/"+cnic.value.trim()))
  .then(snapshot=>{
    loading.style.display="none";
    page1.classList.add("hidden");
    page2.classList.remove("hidden");

    if(snapshot.exists()){
      let d=snapshot.val();
      resultBox.className="result-box success";
      resultBox.innerHTML=`
        <p><b>نام:</b> ${d.name}</p>
        <p>${d.message}</p>
      `;
    }else{
      resultBox.className="result-box fail";
      resultBox.innerHTML=`
        آپ کا نشوونما پروگرام میں ریکارڈ موجود نہیں ہے<br><br>
        براہِ مہربانی قریبی بے نظیر انکم سپورٹ پروگرام<br>
        یا نشوونما کیمپ سائٹ پر رجوع کریں
      `;
    }
  });
}
</script>

</body>
</html>
